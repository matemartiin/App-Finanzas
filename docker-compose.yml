version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas_secret
      POSTGRES_DB: finanzas_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finanzas:finanzas_secret@postgres:5432/finanzas_db
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      ALLOWED_ORIGINS: http://localhost:3000

volumes:
  pgdata:
