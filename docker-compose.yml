version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: finanzapp-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finanzapp
      POSTGRES_PASSWORD: finanzapp
      POSTGRES_DB: finanzapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzapp -d finanzapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finanzapp-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://finanzapp:finanzapp@postgres:5432/finanzapp
      ML_SERVICE_URL: http://ml-service:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: finanzapp-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      ALLOWED_ORIGINS: http://localhost:3000

volumes:
  pgdata:
